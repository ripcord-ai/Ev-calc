<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EV Calc">
<link rel="apple-touch-icon" id="appIcon" href="">
<title>EV Calc</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#111317;color:#f3f4f6;display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px)}
.app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
h1{font-size:24px;font-weight:700;letter-spacing:-0.3px}
.st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#d1d5db}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
.card{background:#1c1f24;border-radius:16px;padding:16px 18px;border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:12px}
.top-card{flex-direction:row;align-items:center;justify-content:space-between;padding:20px}
.tmr{font-size:48px;font-weight:500;color:#34d399;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.meta{display:flex;flex-direction:column;gap:5px;text-align:right;white-space:nowrap}
.sub{font-size:13px;color:#8b929e}
.wht{font-size:15px;color:#e5e7eb;font-weight:500}
.cost{font-size:14px;color:#34d399;font-weight:500}
.start-badge{font-size:14px;color:#f59e0b;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline}
.val{font-size:20px;font-weight:600;color:#fff}
.pct{font-size:14px;color:#8b929e;margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#32363f;border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:#32363f;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:24px;width:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{height:24px;width:24px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dual{position:relative;height:28px;display:flex;align-items:center}
.trk,.rng{position:absolute;height:4px;border-radius:2px}
.trk{width:100%;background:#32363f;z-index:1}
.rng{background:#fff;z-index:2}
.dual input{position:absolute;pointer-events:none;z-index:3}
.dual input::-webkit-slider-runnable-track{background:transparent;pointer-events:none}
.dual input::-moz-range-track{background:transparent;pointer-events:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;position:relative;z-index:4}
.dual input::-moz-range-thumb{pointer-events:auto;position:relative;z-index:4}
.inputs-grid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px}
.pbox{background:#14161a;border-radius:12px;padding:10px 10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #282c34;height:44px}
.pbox select,.pbox input{background:transparent;border:none;color:#fff;font-size:17px;font-weight:600;width:100%;outline:none;color-scheme:dark;-webkit-appearance:none;appearance:none}
.pbox input[type=time]{font-size:16px;padding:0}
.clr{background:none;border:none;color:#8b929e;font-size:15px;padding-left:4px;cursor:pointer}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prs button{background:#252930;border:none;color:#d1d5db;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
.prs button:active{background:#e2e8f0;color:#111317}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>EV Calc</h1>
    <div class="st"><span class="dot"></span><span>Расчёт заряда</span></div>
  </header>

  <div class="card top-card">
    <div>
      <div class="tmr" id="td">11:19</div>
      <div class="sub" style="margin-top:6px">время заряда</div>
    </div>
    <div class="meta">
      <div class="sub" id="fin">готово в 06:32</div>
      <div class="wht" id="en">15.8 кВт·ч</div>
      <div class="cost" id="cst">≈ 78 ₽</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="sub">Ёмкость батареи</span>
      <span class="val"><span id="bv">44</span><span class="pct"> кВт·ч</span></span>
    </div>
    <input type="range" id="bs" min="10" max="150" value="44">
  </div>

  <div class="card">
    <div class="row">
      <div><div class="sub">Текущий заряд</div><div class="val"><span id="sv">59</span><span class="pct">%</span></div></div>
      <div style="text-align:right"><div class="sub">Зарядить до</div><div class="val"><span id="ev">95</span><span class="pct">%</span></div></div>
    </div>
    <div class="dual">
      <div class="trk"></div><div class="rng" id="rng"></div>
      <input type="range" id="ss" min="0" max="100" value="59">
      <input type="range" id="es" min="0" max="100" value="95">
    </div>
  </div>

  <div class="card">
    <div class="inputs-grid">
      <div>
        <div class="sub" style="margin-bottom:6px">Мощность</div>
        <div class="pbox"><select id="pi"></select><span class="sub">кВт</span></div>
      </div>
      <div>
        <div class="sub" style="margin-bottom:6px">Тариф</div>
        <div class="pbox"><select id="ti"></select><span class="sub">₽</span></div>
      </div>
      <div>
        <div class="sub" style="margin-bottom:6px">Готово к</div>
        <div class="pbox"><input type="time" id="gt" value=""><button class="clr" id="cb" onclick="ct()" style="display:none">✕</button></div>
      </div>
    </div>
    <div class="prs">
      <button onclick="sp(1.1)">1.1 кВт</button><button onclick="sp(1.4)">1.4 кВт</button><button onclick="sp(1.8)">1.8 кВт</button>
      <button onclick="sp(2.4)">2.4 кВт</button><button onclick="sp(3.0)">3.0 кВт</button><button onclick="sp(3.5)">3.5 кВт</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
(function makeIcon(){
  let cv=document.createElement('canvas');cv.width=cv.height=180;
  let cx=cv.getContext('2d');
  cx.fillStyle='#1c1f24';cx.fillRect(0,0,180,180);
  cx.strokeStyle='#34d399';cx.lineWidth=6;cx.beginPath();cx.arc(90,90,62,0,Math.PI*2);cx.stroke();
  cx.fillStyle='#34d399';cx.beginPath();
  cx.moveTo(98,46);cx.lineTo(64,96);cx.lineTo(88,96);cx.lineTo(82,134);cx.lineTo(116,84);cx.lineTo(92,84);
  cx.closePath();cx.fill();
  $('appIcon').href=cv.toDataURL('image/png');
})();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
function fillSelects(curP,curT){
  let pArr=[];
  for(let v=10;v<=220;v++)pArr.push(+(v/10).toFixed(1));
  if(curP&&!pArr.includes(+curP))pArr.push(+curP);
  pArr.sort((a,b)=>a-b);
  $('pi').innerHTML=pArr.map(v=>`<option value="${v}">${v.toFixed(1).replace('.',',')}</option>`).join('');

  let tArr=[0];
  for(let v=100;v<=1500;v+=5)tArr.push(+(v/100).toFixed(2));
  if(curT!==undefined&&!tArr.includes(+curT))tArr.push(+curT);
  tArr.sort((a,b)=>a-b);
  $('ti').innerHTML=tArr.map(v=>`<option value="${v}">${v===0?'0':v.toFixed(2).replace('.',',')}</option>`).join('');
}
function calc(){
  let c=+$('bs').value,s=+$('ss').value,e=+$('es').value,p=+$('pi').value||0,tr=+$('ti').value||0,gt=$('gt').value;
  $('cb').style.display=gt?'block':'none';
  if(s>e){s=e;$('ss').value=s}
  $('bv').textContent=c;$('sv').textContent=s;$('ev').textContent=e;
  $('rng').style.left=s+'%';$('rng').style.width=(e-s)+'%';
  let k=c*((e-s)/100);
  $('en').textContent=k.toFixed(1)+' кВт·ч';
  $('cst').textContent=(tr>0&&k>0)?('≈ '+Math.round(k*tr)+' ₽'):'';
  if(p>0&&k>0){
    let totalMin=Math.round((k/p)*60);
    let h=Math.floor(totalMin/60),m=totalMin%60;
    $('td').textContent=(h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
    if(gt){
      let [gh,gm]=gt.split(':').map(Number);
      let targetMin=gh*60+gm;
      let startMin=(targetMin-totalMin)%1440;
      if(startMin<0)startMin+=1440;
      let sh=Math.floor(startMin/60),sm=startMin%60;
      $('fin').className='start-badge';
      $('fin').textContent='старт в '+String(sh).padStart(2,'0')+':'+String(sm).padStart(2,'0');
    }else{
      let d=new Date(Date.now()+totalMin*60000);
      $('fin').className='sub';
      $('fin').textContent='готово в '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
  }else{
    $('td').textContent='00:00';
    $('fin').className='sub';
    $('fin').textContent='зарядка не нужна';
  }
  localStorage.setItem('ev',JSON.stringify({c,s,e,p,tr,gt}));
}
function sp(v){$('pi').value=v;calc()}
function ct(){$('gt').value='';calc()}
['bs','ss','es','pi','ti','gt'].forEach(id=>$(id).addEventListener('change',calc));
['bs','ss','es','gt'].forEach(id=>$(id).addEventListener('input',calc));
let saved=JSON.parse(localStorage.getItem('ev')||'null');
let initP=saved&&saved.p?saved.p:1.4;
let initT=saved&&saved.tr!==undefined?saved.tr:4.92;
fillSelects(initP,initT);
if(saved){
  $('bs').value=saved.c;$('ss').value=saved.s;$('es').value=saved.e;
  if(saved.gt)$('gt').value=saved.gt;
}
$('pi').value=initP;
$('ti').value=initT;
calc();
</script>
</body>
</html>
