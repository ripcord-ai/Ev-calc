<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EV Calc">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png?v=1">
<title>EV Calc</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#111317;color:#f3f4f6;display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px)}
.app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
h1{font-size:24px;font-weight:700;letter-spacing:-0.3px}
.st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#d1d5db}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
.card{background:#1c1f24;border-radius:16px;padding:16px 18px;border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:12px}
.top-card{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:20px}
.tmr{font-size:46px;font-weight:500;color:#34d399;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.meta{display:flex;flex-direction:column;gap:5px;text-align:right;white-space:nowrap}
.sub{font-size:13px;color:#8b929e}
.wht{font-size:15px;color:#e5e7eb;font-weight:500}
.cost{font-size:14px;color:#34d399;font-weight:500}
.start-badge{font-size:14px;color:#f59e0b;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline}
.val{font-size:20px;font-weight:600;color:#fff}
.pct{font-size:14px;color:#8b929e;margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#32363f;border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:#32363f;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:24px;width:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{height:24px;width:24px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dual{position:relative;height:28px;display:flex;align-items:center}
.trk,.rng{position:absolute;height:4px;border-radius:2px}
.trk{width:100%;background:#32363f;z-index:1}
.rng{background:#fff;z-index:2}
.dual input{position:absolute;pointer-events:none;z-index:3}
.dual input::-webkit-slider-runnable-track{background:transparent;pointer-events:none}
.dual input::-moz-range-track{background:transparent;pointer-events:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;position:relative;z-index:4}
.dual input::-moz-range-thumb{pointer-events:auto;position:relative;z-index:4}
.inputs-grid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px}
.pbox{background:#14161a;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #282c34;height:44px;cursor:pointer}
.pbox-val{color:#fff;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.pbox-val.empty{color:#8b929e;font-weight:500}
.clr{background:none;border:none;color:#8b929e;font-size:15px;padding:2px 0 2px 6px;cursor:pointer}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prs button{background:#252930;border:none;color:#d1d5db;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
.prs button:active{background:#e2e8f0;color:#111317}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ovl.open{opacity:1;pointer-events:auto}
.sht{width:100%;max-width:420px;background:#1c1f24;border-radius:20px 20px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom,16px) + 12px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);border-top:1px solid rgba(255,255,255,.08)}
.ovl.open .sht{transform:translateY(0)}
.sht-hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #282c34;margin-bottom:8px}
.sht-ttl{font-size:15px;font-weight:600;color:#e5e7eb}
.sht-btn{background:none;border:none;color:#34d399;font-size:16px;font-weight:600;cursor:pointer;padding:4px 8px}
.whl-wrap{position:relative;height:180px;display:flex;justify-content:center;align-items:center;overflow:hidden;perspective:600px;mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.whl-bar{position:absolute;left:12px;right:12px;height:36px;background:rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
.whl-col{height:180px;width:90px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;transform-style:preserve-3d}
.whl-col::-webkit-scrollbar{display:none}
.whl-pad{height:72px}
.whl-itm{height:36px;line-height:36px;scroll-snap-align:center;font-size:21px;font-weight:500;color:#9ca3af;font-variant-numeric:tabular-nums;cursor:pointer;will-change:transform,opacity}
.whl-itm.act{color:#fff;font-weight:600}
.whl-sep{font-size:22px;font-weight:700;color:#fff;padding:0 2px;margin-bottom:2px}
.whl-unit{font-size:16px;color:#8b929e;margin-left:8px}
</style>
</head>
<body>
<body>
<div class="app">
  <header><h1>EV Calc</h1><div class="st"><span class="dot"></span><span>Расчёт заряда</span></div></header>
  <div class="card top-card">
    <div><div class="tmr" id="td">11:19</div><div class="sub" style="margin-top:6px">время заряда</div></div>
    <div class="meta"><div class="sub" id="fin">готово в 06:32</div><div class="wht" id="en">15.8 кВт·ч</div><div class="cost" id="cst">≈ 78 ₽</div></div>
  </div>
  <div class="card">
    <div class="row"><span class="sub">Ёмкость батареи</span><span class="val"><span id="bv">44</span><span class="pct"> кВт·ч</span></span></div>
    <input type="range" id="bs" min="10" max="150" value="44">
  </div>
  <div class="card">
    <div class="row">
      <div><div class="sub">Текущий заряд</div><div class="val"><span id="sv">59</span><span class="pct">%</span></div></div>
      <div style="text-align:right"><div class="sub">Зарядить до</div><div class="val"><span id="ev">95</span><span class="pct">%</span></div></div>
    </div>
    <div class="dual"><div class="trk"></div><div class="rng" id="rng"></div><input type="range" id="ss" min="0" max="100" value="59"><input type="range" id="es" min="0" max="100" value="95"></div>
  </div>
  <div class="card">
    <div class="inputs-grid">
      <div><div class="sub" style="margin-bottom:6px">Мощность</div><div class="pbox" onclick="openWhl('p')"><span class="pbox-val" id="pv">1,4</span><span class="sub">кВт</span></div></div>
      <div><div class="sub" style="margin-bottom:6px">Тариф</div><div class="pbox" onclick="openWhl('t')"><span class="pbox-val" id="tv">4,92</span><span class="sub">₽</span></div></div>
      <div><div class="sub" style="margin-bottom:6px">Готово к</div><div class="pbox" onclick="openWhl('g')"><span class="pbox-val empty" id="gv">--:--</span><button class="clr" id="cb" onclick="ct(event)" style="display:none">✕</button></div></div>
    </div>
    <div class="prs">
      <button onclick="sp(1.1)">1.1 кВт</button><button onclick="sp(1.4)">1.4 кВт</button><button onclick="sp(1.8)">1.8 кВт</button>
      <button onclick="sp(2.4)">2.4 кВт</button><button onclick="sp(3.0)">3.0 кВт</button><button onclick="sp(3.5)">3.5 кВт</button>
    </div>
  </div>
</div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeWhl()">
  <div class="sht">
    <div class="sht-hdr"><span class="sht-ttl" id="wTtl">Мощность</span><button class="sht-btn" onclick="closeWhl()">Готово</button></div>
    <div class="whl-wrap"><div class="whl-bar"></div><div class="whl-col" id="wCol1"></div><div class="whl-sep" id="wSep">,</div><div class="whl-col" id="wCol2"></div><div class="whl-unit" id="wUnit">кВт</div></div>
  </div>
</div>
<script>
function $(id){return document.getElementById(id)}
(function(){var cv=document.createElement('canvas');cv.width=cv.height=180;var cx=cv.getContext('2d');cx.fillStyle='#1c1f24';cx.fillRect(0,0,180,180);cx.strokeStyle='#34d399';cx.lineWidth=6;cx.beginPath();cx.arc(90,90,62,0,Math.PI*2);cx.stroke();cx.fillStyle='#34d399';cx.beginPath();cx.moveTo(98,46);cx.lineTo(64,96);cx.lineTo(88,96);cx.lineTo(82,134);cx.lineTo(116,84);cx.lineTo(92,84);cx.closePath();cx.fill();var u=cv.toDataURL('image/png');$('appIcon').href=u;if($('favIcon'))$('favIcon').href=u})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
var curP=1.4,curT=4.92,curG='',wMode=null,sTimer=null;
function buildCol(el,max,pad2){
  var h='<div class="whl-pad"></div>';
  for(var i=0;i!==max+1;i++)h+='<div class="whl-itm" onclick="tapItm(this,'+i+')">'+(pad2&&10>i?'0'+i:i)+'</div>';
  el.innerHTML=h+'<div class="whl-pad"></div>';
}
function tapItm(el,idx){el.parentElement.scrollTo({top:idx*36,behavior:'smooth'})}
function openWhl(mode){
  wMode=mode;var c1=$('wCol1'),c2=$('wCol2');
  if(mode==='p'){
    $('wTtl').textContent='Мощность зарядки';$('wSep').textContent=',';$('wUnit').textContent='кВт';$('wUnit').style.display='';
    buildCol(c1,22,false);buildCol(c2,9,false);
    var i1=Math.floor(curP),i2=Math.round((curP-i1)*10);
    $('ovl').classList.add('open');setScroll(c1,i1);setScroll(c2,i2);
  }else if(mode==='t'){
    $('wTtl').textContent='Тариф за кВт·ч';$('wSep').textContent=',';$('wUnit').textContent='₽';$('wUnit').style.display='';
    buildCol(c1,20,false);buildCol(c2,99,true);
    var i1=Math.floor(curT),i2=Math.round((curT-i1)*100);
    $('ovl').classList.add('open');setScroll(c1,i1);setScroll(c2,i2);
  }else{
    $('wTtl').textContent='Готово к';$('wSep').textContent=':';$('wUnit').style.display='none';
    buildCol(c1,23,true);buildCol(c2,59,true);
    var gh=curG?parseInt(curG.slice(0,2),10):9,gm=curG?parseInt(curG.slice(3,5),10):0;
    if(!curG){curG='09:00';calc()}
    $('ovl').classList.add('open');setScroll(c1,gh);setScroll(c2,gm);
  }
}
function setScroll(col,idx){col.scrollTop=idx*36;tiltCol(col)}
function tiltCol(col){
  var pos=col.scrollTop/36,act=Math.round(pos),items=col.querySelectorAll('.whl-itm');
  for(var i=0;i!==items.length;i++){
    var d=i-pos;
    if(3>Math.abs(d)){
      var ang=d*-24,sc=1-Math.abs(d)*0.07,op=Math.max(0.25,1-Math.abs(d)*0.28);
      items[i].style.transform='rotateX('+ang+'deg) scale('+sc+')';
      items[i].style.opacity=op;
    }else{items[i].style.opacity=0.15}
    items[i].classList.toggle('act',i===act);
  }
}
function onWhlScroll(col){
  tiltCol(col);clearTimeout(sTimer);
  sTimer=setTimeout(function(){
    var i1=Math.round($('wCol1').scrollTop/36),i2=Math.round($('wCol2').scrollTop/36);
    if(wMode==='p'){curP=+(i1+i2/10).toFixed(1);if(0.1>curP)curP=0.1}
    else if(wMode==='t'){curT=+(i1+i2/100).toFixed(2)}
    else if(wMode==='g'){curG=(10>i1?'0'+i1:i1)+':'+(10>i2?'0'+i2:i2)}
    calc();
  },60);
}
$('wCol1').addEventListener('scroll',function(){onWhlScroll(this)});
$('wCol2').addEventListener('scroll',function(){onWhlScroll(this)});
function closeWhl(){$('ovl').classList.remove('open');wMode=null}
function calc(){
  var c=+$('bs').value,s=+$('ss').value,e=+$('es').value;
  $('pv').textContent=curP.toFixed(1).replace('.',',');$('tv').textContent=curT.toFixed(2).replace('.',',');
  $('gv').textContent=curG||'--:--';$('gv').className=curG?'pbox-val':'pbox-val empty';
  $('cb').style.display=curG?'block':'none';
  if(s>e){s=e;$('ss').value=s}
  $('bv').textContent=c;$('sv').textContent=s;$('ev').textContent=e;
  $('rng').style.left=s+'%';$('rng').style.width=(e-s)+'%';
  var k=c*((e-s)/100);$('en').textContent=k.toFixed(1)+' кВт·ч';
  $('cst').textContent=curT>0?('≈ '+Math.round(k*curT)+' ₽'):'';
  if(curP>0&&k>0){
    var totalMin=Math.round((k/curP)*60),h=Math.floor(totalMin/60),m=totalMin%60;
    $('td').textContent=(10>h?'0'+h:h)+':'+(10>m?'0'+m:m);
    if(curG){
      var gh=parseInt(curG.slice(0,2),10),gm=parseInt(curG.slice(3,5),10);
      var startMin=(gh*60+gm-totalMin)%1440;
      if(0>startMin)startMin+=1440;
      $('fin').className='start-badge';$('fin').textContent='старт в '+String(Math.floor(startMin/60)).padStart(2,'0')+':'+String(startMin%60).padStart(2,'0');
    }else{
      var d=new Date(Date.now()+totalMin*60000);
      $('fin').className='sub';$('fin').textContent='готово в '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
  }else{$('td').textContent='00:00';$('fin').className='sub';$('fin').textContent='уже заряжен'}
  localStorage.setItem('ev',JSON.stringify({c:c,s:s,e:e,p:curP,tr:curT,gt:curG}));
}
function sp(v){curP=v;calc()}
function ct(ev){ev.stopPropagation();curG='';calc()}
['bs','ss','es'].forEach(function(id){$(id).addEventListener('input',calc)});
var saved=JSON.parse(localStorage.getItem('ev')||'null');
if(saved){$('bs').value=saved.c;$('ss').value=saved.s;$('es').value=saved.e;if(saved.p)curP=+saved.p;if(saved.tr!==undefined)curT=+saved.tr;if(saved.gt)curG=saved.gt}
calc();
</script>
</body>
</html>
